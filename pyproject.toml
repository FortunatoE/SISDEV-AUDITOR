[project]
name = "sisdev-auditor"
version = "0.2.0"
description = "Auditoria e conciliação SAP, SISDEV e Agrotis"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Flask>=3.1,<4.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "pdfplumber>=0.11,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "vercel>=0.10,<0.11",
  "xlrd>=2.0,<3.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[[tool.vercel.workflows]]
entrypoint = "workflow.imports:wf"

[tool.pytest.ini_options]
testpaths = ["tests"]
